spring.application.name=backend-market
spring.datasource.url=jdbc:mariadb://localhost:3306/market_baza
server.address=0.0.0.0
server.port=8080
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
logging.level.org.springframework.security=DEBUG


spring.mail.host=smtp.gmail.com
spring.mail.port=587

spring.mail.username=${MARKET_MAIL_USERNAME}
spring.mail.password=${MARKET_MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

market.mail.from=${MARKET_MAIL_USERNAME}

# Adres formularza resetowania hasla w React
market.frontend.reset-url=http://192.168.0.174:5173/reset-password
